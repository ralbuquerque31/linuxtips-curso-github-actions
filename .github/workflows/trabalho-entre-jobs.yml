name: Vendo arquivos compartilhados entre steps

on:
  push:
    branches:
      - main

jobs:
  job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Confere versao do Ubuntu
        run: cat /etc/os-release

      - name: Exibir uma mensagem
        run: echo "Estou fazendo o curso de Github Actions da Linuxtips" > mensagem.txt
      
      - uses: actions/upload-artifact@v4
        with:
            name: strigus
            path: /home/ubuntu/mensagem.txt
  job_2:
     runs-on: ubuntu-latest
     steps:
      - name: Ver o conteudo do diretorio
        run: ls -lha

      - uses: actions/download-artifact@v4
        with:
          name: strigus
          path: mensagem.txt

      - name: Ver o conteudo do diretorio
        run: ls -lha && ls ./strigus/

      - name: Acessa arquivo mensagem
        run: mv strigus/mensagem.txt . && rm -rf ./strigus

     - name: Ver o conteudo do diretorio
        run: ls -lha

      - name: Acessa arquivo mensagem
        run: cat mensagem.tx





